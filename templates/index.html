{% extends "base.html" %}
{% block title %}SANKSI — Recharge 1xBet{% endblock %}

{% block content %}
<header class="app-header">
    <div class="logo">
        <div class="logo-mark">S</div>
        SANKSI
    </div>
    <a href="/historique" class="header-link">📋 Historique</a>
</header>

<div class="bm-card">
    <div class="bm-logo">1X</div>
    <div>
        <div class="bm-name">1xBet</div>
        <div class="bm-subtitle">Dépôt &amp; Retrait</div>
    </div>
</div>

<div class="operators">
    <button type="button" class="op-btn op-orange active" onclick="selectOperator('Orange', this)">Orange<br>Money</button>
    <button type="button" class="op-btn op-moov" onclick="selectOperator('Moov', this)">Moov<br>Money</button>
    <button type="button" class="op-btn op-wave" onclick="selectOperator('Wave', this)">Wave</button>
</div>

<div class="tabs" id="tabs">
    <div class="tabs-indicator"></div>
    <button type="button" class="tab active" onclick="switchTab('depot', this)">Dépôt</button>
    <button type="button" class="tab" onclick="switchTab('retrait', this)">Retrait</button>
</div>

<div class="amount-display">
    <span class="currency">FCFA</span>
    <span class="value" id="display-amount">0</span>
</div>

<div class="shortcuts">
    <button type="button" class="shortcut-btn" onclick="addAmount(500)">+500</button>
    <button type="button" class="shortcut-btn" onclick="addAmount(1000)">+1K</button>
    <button type="button" class="shortcut-btn" onclick="addAmount(5000)">+5K</button>
    <button type="button" class="shortcut-btn" onclick="addAmount(10000)">+10K</button>
</div>

<div class="keypad">
    <button type="button" class="key" onclick="pressKey('1')">1</button>
    <button type="button" class="key" onclick="pressKey('2')">2</button>
    <button type="button" class="key" onclick="pressKey('3')">3</button>
    <button type="button" class="key" onclick="pressKey('4')">4</button>
    <button type="button" class="key" onclick="pressKey('5')">5</button>
    <button type="button" class="key" onclick="pressKey('6')">6</button>
    <button type="button" class="key" onclick="pressKey('7')">7</button>
    <button type="button" class="key" onclick="pressKey('8')">8</button>
    <button type="button" class="key" onclick="pressKey('9')">9</button>
    <button type="button" class="key action" onclick="pressKey('00')">00</button>
    <button type="button" class="key" onclick="pressKey('0')">0</button>
    <button type="button" class="key action" onclick="deleteKey()">⌫</button>
</div>

<button type="button" class="btn-main" id="btn-main" onclick="validerMontant()">Continuer le dépôt</button>
{% endblock %}

{% block scripts %}
<script>
    var montant = 0;
    var currentTab = 'depot';
    var currentOperator = 'Orange';
    var milestones = [1000, 5000, 10000, 25000, 50000, 100000];
    var lastMilestone = 0;

    function selectOperator(op, el) {
        document.querySelectorAll('.op-btn').forEach(function (b) { b.classList.remove('active'); });
        el.classList.add('active');
        currentOperator = op;
    }

    function switchTab(tab, el) {
        document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
        el.classList.add('active');
        currentTab = tab;
        var tabs = document.getElementById('tabs');
        var btn = document.getElementById('btn-main');
        if (tab === 'retrait') {
            tabs.classList.add('retrait');
            btn.innerText = 'Continuer le retrait';
            btn.classList.add('retrait-mode');
        } else {
            tabs.classList.remove('retrait');
            btn.innerText = 'Continuer le dépôt';
            btn.classList.remove('retrait-mode');
        }
    }

    function bumpAmount() {
        var el = document.getElementById('display-amount');
        el.classList.remove('bump');
        void el.offsetWidth;
        el.classList.add('bump');
    }

    function checkMilestone(oldVal, newVal) {
        for (var i = 0; i < milestones.length; i++) {
            if (newVal >= milestones[i] && oldVal < milestones[i]) {
                fireConfetti();
                break;
            }
        }
    }

    function updateDisplay(oldVal) {
        document.getElementById('display-amount').innerText = montant.toLocaleString('fr-FR');
        bumpAmount();
        checkMilestone(oldVal, montant);
    }

    function pressKey(val) {
        var old = montant;
        if (montant === 0) montant = parseInt(val, 10);
        else montant = parseInt(montant.toString() + val, 10);
        if (isNaN(montant)) montant = 0;
        updateDisplay(old);
    }

    function deleteKey() {
        var old = montant;
        montant = Math.floor(montant / 10);
        updateDisplay(old);
    }

    function addAmount(val) {
        var old = montant;
        montant += val;
        updateDisplay(old);
    }

    function validerMontant() {
        if (montant < 500) {
            showToast("Le montant minimum est de 500 FCFA", "error");
            var btn = document.getElementById('btn-main');
            btn.animate(
                [{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' },
                 { transform: 'translateX(8px)' }, { transform: 'translateX(-4px)' },
                 { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }],
                { duration: 350, easing: 'ease-out' }
            );
            return;
        }
        var url = currentTab === 'depot'
            ? '/depot?montant=' + montant + '&operateur=' + encodeURIComponent(currentOperator)
            : '/retrait/debut?montant=' + montant + '&operateur=' + encodeURIComponent(currentOperator);
        window.location.href = url;
    }
</script>
{% endblock %}
