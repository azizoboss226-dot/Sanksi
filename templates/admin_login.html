{% extends "base.html" %}
{% block title %}SANKSI - Admin{% endblock %}

{% block content %}
<div class="page fade-in" style="justify-content:center;">
    <form method="POST" class="card">
        <h1 class="page-title">SANKSI Admin</h1>
        {% if erreur %}
        <div class="alert alert-danger">{{ erreur }}</div>
        {% endif %}
        <input type="password" name="password" placeholder="Mot de passe" class="input-field" style="margin-bottom:14px;">
        <button type="submit" class="btn btn-primary">Connexion</button>
    </form>
</div>
{% endblock %}
