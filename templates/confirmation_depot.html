<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande envoyée</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0F172A] text-white flex items-center justify-center h-screen p-6">
    <div class="text-center bg-[#1E293B] p-8 rounded-2xl border border-[#334155] max-w-md w-full">
        <div class="text-6xl mb-4">✅</div>
        <h1 class="text-2xl font-black text-[#38BDF8] mb-2">Demande reçue !</h1>
        <p class="text-sm text-gray-400 mb-4">Ta demande de dépôt de <b class="text-white">{{ montant }} FCFA</b> a bien été enregistrée.</p>
        <div class="bg-[#0F172A] p-4 rounded-xl border border-dashed border-[#38BDF8] mb-6">
            <p class="text-xs text-gray-400">Référence</p>
            <p class="text-lg font-bold">{{ reference }}</p>
        </div>
        <p class="text-xs text-gray-400 mb-6">Un agent vérifie ton paiement et crédite ton compte sous peu.</p>
        <a href="/" class="block w-full bg-[#38BDF8] text-[#0F172A] font-bold py-3 rounded-xl">Retour à l'accueil</a>
    </div>
</body>
</html>
