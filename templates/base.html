<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}SANKSI{% endblock %}</title>
    <meta name="theme-color" content="#FAF7FF">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-container">
        {% block content %}{% endblock %}
    </div>
    <div id="toast-container"></div>

    <script>
        // ---- Ripple universel ----
        document.addEventListener('click', function (e) {
            var t = e.target.closest('button, .op-btn, .tab, .key, .shortcut-btn, .btn-main, .btn, .header-link, .op-btn');
            if (!t || t.dataset.noRipple) return;
            var r = t.getBoundingClientRect();
            var s = Math.max(r.width, r.height);
            var el = document.createElement('span');
            el.className = 'ripple';
            el.style.width = el.style.height = s + 'px';
            el.style.left = (e.clientX - r.left - s / 2) + 'px';
            el.style.top = (e.clientY - r.top - s / 2) + 'px';
            if (getComputedStyle(t).position === 'static') t.style.position = 'relative';
            t.style.overflow = 'hidden';
            t.appendChild(el);
            setTimeout(function () { el.remove(); }, 600);
        });

        // ---- Toast ----
        function showToast(message, type) {
            type = type || 'info';
            var c = document.getElementById('toast-container');
            var t = document.createElement('div');
            t.className = 'toast toast-' + type;
            t.textContent = message;
            c.appendChild(t);
            requestAnimationFrame(function () { t.classList.add('show'); });
            setTimeout(function () {
                t.classList.remove('show');
                setTimeout(function () { t.remove(); }, 300);
            }, 3000);
        }

        // ---- Confettis ----
        function fireConfetti() {
            var colors = ['#7C3AED', '#EC4899', '#FFC93C', '#10B981', '#3B82F6', '#F472B6'];
            for (var i = 0; i < 40; i++) {
                var p = document.createElement('div');
                p.className = 'confetti';
                p.style.left = (Math.random() * 100) + '%';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.animationDelay = (Math.random() * 0.15) + 's';
                p.style.animationDuration = (0.9 + Math.random() * 0.7) + 's';
                p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                document.body.appendChild(p);
                setTimeout((function (el) { return function () { el.remove(); }; })(p), 2200);
            }
        }
    </script>
    <script>
    (function () {
        try {
            var p = new URLSearchParams(location.search).get('telephone');
            if (p) localStorage.setItem('sanksi_tel', p);
        } catch (e) {}

        document.addEventListener('submit', function (e) {
            var i = e.target.querySelector('[name="telephone"]');
            if (i && i.value) {
                try { localStorage.setItem('sanksi_tel', i.value.trim()); } catch (x) {}
            }
        }, true);

        document.addEventListener('click', function () {
            if (window.Notification && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }, { once: true });

        function verifier() {
            var tel = null;
            try { tel = localStorage.getItem('sanksi_tel'); } catch (e) {}
            if (!tel) return;
            fetch('/api/notifications?telephone=' + encodeURIComponent(tel))
                .then(function (r) { return r.json(); })
                .then(function (liste) {
                    liste.forEach(function (m, i) {
                        setTimeout(function () {
                            showToast(m, 'info');
                            if (window.Notification && Notification.permission === 'granted') {
                                new Notification('SANKSI', { body: m });
                            }
                        }, i * 3500);
                    });
                })
                .catch(function () {});
        }
        verifier();
        setInterval(verifier, 8000);
    })();
    </script>
    <script>
    (function () {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
        navigator.serviceWorker.register('/sw.js');

        function convertir(s) {
            var p = '='.repeat((4 - s.length % 4) % 4);
            var b = (s + p).replace(/-/g, '+').replace(/_/g, '/');
            var r = atob(b), o = new Uint8Array(r.length);
            for (var i = 0; i < r.length; i++) o[i] = r.charCodeAt(i);
            return o;
        }

        var fait = false;
        function abonner(tel) {
            if (fait) return;
            fait = true;
            navigator.serviceWorker.ready.then(function (reg) {
                return fetch('/api/push/cle').then(function (r) { return r.text(); }).then(function (cle) {
                    if (!cle) throw new Error('pas de cle');
                    return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: convertir(cle) });
                });
            }).then(function (sub) {
                return fetch('/api/push/abonner', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telephone: tel, subscription: sub.toJSON() })
                });
            }).catch(function () { fait = false; });
        }

        function bouton(tel) {
            if (document.getElementById('btn-push')) return;
            var b = document.createElement('button');
            b.id = 'btn-push';
            b.type = 'button';
            b.className = 'btn btn-primary';
            b.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:440px;z-index:9000;';
            b.textContent = '🔔 Activer les notifications';
            b.onclick = function () {
                Notification.requestPermission().then(function (perm) {
                    if (perm === 'granted') abonner(tel);
                    b.remove();
                });
            };
            document.body.appendChild(b);
        }

        function maj() {
            var tel = null;
            try { tel = localStorage.getItem('sanksi_tel'); } catch (e) {}
            if (!tel || !window.Notification) return;
            if (Notification.permission === 'granted') abonner(tel);
            else if (Notification.permission === 'default') bouton(tel);
        }
        maj();
        setInterval(maj, 5000);
    })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
