    <script>
        // ---- Ripple universel ----
        document.addEventListener('click', function (e) {
            var t = e.target.closest('button, .op-btn, .tab, .key, .shortcut-btn, .btn-main, .btn, .header-link, .op-btn');
            if (!t || t.dataset.noRipple) return;
            var r = t.getBoundingClientRect();
            var s = Math.max(r.width, r.height);
            var el = document.createElement('span');
            el.className = 'ripple';
            el.style.width = el.style.height = s + 'px';
            el.style.left = (e.clientX - r.left - s / 2) + 'px';
            el.style.top = (e.clientY - r.top - s / 2) + 'px';
            if (getComputedStyle(t).position === 'static') t.style.position = 'relative';
            t.style.overflow = 'hidden';
            t.appendChild(el);
            setTimeout(function () { el.remove(); }, 600);
        });

        // ---- Toast ----
        function showToast(message, type) {
            type = type || 'info';
            var c = document.getElementById('toast-container');
            var t = document.createElement('div');
            t.className = 'toast toast-' + type;
            t.textContent = message;
            c.appendChild(t);
            requestAnimationFrame(function () { t.classList.add('show'); });
            setTimeout(function () {
                t.classList.remove('show');
                setTimeout(function () { t.remove(); }, 300);
            }, 3000);
        }

        // ---- Confettis ----
        function fireConfetti() {
            var colors = ['#7C3AED', '#EC4899', '#FFC93C', '#10B981', '#3B82F6', '#F472B6'];
            for (var i = 0; i < 40; i++) {
                var p = document.createElement('div');
                p.className = 'confetti';
                p.style.left = (Math.random() * 100) + '%';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.animationDelay = (Math.random() * 0.15) + 's';
                p.style.animationDuration = (0.9 + Math.random() * 0.7) + 's';
                p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                document.body.appendChild(p);
                setTimeout((function (el) { return function () { el.remove(); }; })(p), 2200);
            }
        }
    </script>
    <script>
    (function () {
        try {
            var p = new URLSearchParams(location.search).get('telephone');
            if (p) localStorage.setItem('sanksi_tel', p);
        } catch (e) {}

        document.addEventListener('submit', function (e) {
            var i = e.target.querySelector('[name="telephone"]');
            if (i && i.value) {
                try { localStorage.setItem('sanksi_tel', i.value.trim()); } catch (x) {}
            }
        }, true);


        function verifier() {
            var tel = null;
            try { tel = localStorage.getItem('sanksi_tel'); } catch (e) {}
            if (!tel) return;
            fetch('/api/notifications?telephone=' + encodeURIComponent(tel))
                .then(function (r) { return r.json(); })
                .then(function (liste) {
                    liste.forEach(function (m, i) {
                        setTimeout(function () {
                            showToast(m, 'info');
                            if (window.Notification && Notification.permission === 'granted') {
                                new Notification('SANKSI', { body: m });
                            }
                        }, i * 3500);
                    });
                })
                .catch(function () {});
        }
        verifier();
        setInterval(verifier, 8000);
    })();
    </script>
    <script>
    (function () {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
        navigator.serviceWorker.register('/sw.js');

        function convertir(s) {
            var p = '='.repeat((4 - s.length % 4) % 4);
            var b = (s + p).replace(/-/g, '+').replace(/_/g, '/');
            var r = atob(b), o = new Uint8Array(r.length);
            for (var i = 0; i < r.length; i++) o[i] = r.charCodeAt(i);
            return o;
        }

        var fait = false;
        function abonner(tel) {
            if (fait) return;
            fait = true;
            navigator.serviceWorker.ready.then(function (reg) {
                return fetch('/api/push/cle').then(function (r) { return r.text(); }).then(function (cle) {
                    if (!cle) throw new Error('pas de cle');
                    return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: convertir(cle) });
                });
            }).then(function (sub) {
                return fetch('/api/push/abonner', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telephone: tel, subscription: sub.toJSON() })
                });
            }).catch(function () { fait = false; });
        }

        function bouton(tel) {
            if (document.getElementById('btn-push')) return;
            var b = document.createElement('button');
            b.id = 'btn-push';
            b.type = 'button';
            b.className = 'btn btn-primary';
            b.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:440px;z-index:9000;';
            b.textContent = '🔔 Activer les notifications';
            b.onclick = function () {
                Notification.requestPermission().then(function (perm) {
                    if (perm === 'granted') abonner(tel);
                    b.remove();
                });
            };
            document.body.appendChild(b);
        }

        function maj() {
            var tel = null;
            try { tel = localStorage.getItem('sanksi_tel'); } catch (e) {}
            if (!tel || !window.Notification) return;
            if (Notification.permission === 'granted') abonner(tel);
        }
        maj();
        setInterval(maj, 5000);
    })();
    </script>
    <script>
    (function () {
        var path = location.pathname;
        var container = document.querySelector('.app-container');
        if (!container) return;

        // ---- Bandeau notifications (pages dépôt et retrait) ----
        if (false && (path.indexOf('/depot') === 0 || path.indexOf('/retrait') === 0)
            && window.Notification && 'serviceWorker' in navigator
            && Notification.permission === 'default') {
            var estDepot = path.indexOf('/depot') === 0;
            var b = document.createElement('button');
            b.id = 'btn-push';
            b.type = 'button';
            b.className = 'btn btn-primary';
            b.style.cssText = 'width:calc(100% - 40px);margin:12px 20px 0 20px;font-size:14px;';
            b.textContent = '🔔 Active les notifications pour recevoir le statut final de ton ' + (estDepot ? 'dépôt' : 'retrait');
            b.onclick = function () {
                Notification.requestPermission().then(function () { b.remove(); });
            };
            var h = container.querySelector('.app-header');
            if (h) h.after(b); else container.prepend(b);
        }

        // ---- Carte « Télécharger l'application » (accueil) ----
        if (path === '/') {
            var installee = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
            if (!installee) {
                var evt = null;
                var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
                window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); evt = e; });

                var carte = document.createElement('div');
                carte.className = 'bm-card';
                
            }
        }
    })();
    </script>

<script>
    // ===== GESTION DES NOTIFICATIONS =====
    function initNotifPrompts() {
        if (!('Notification' in window)) return;
        
        // Si permission déjà accordée/bloquée ou si l'utilisateur a dit "Plus tard"
        if (Notification.permission !== 'default' || localStorage.getItem('sanksi_notif_dismissed') === 'true') {
            document.querySelectorAll('.notif-prompt').forEach(el => el.style.display = 'none');
            return;
        }
        
        // Sinon, afficher le bandeau
        document.querySelectorAll('.notif-prompt').forEach(el => el.style.display = 'flex');
    }

    
    
    async function askNotificationPermission() {
        if (!('Notification' in window) || !('serviceWorker' in navigator)) {
            if (window.showToast) showToast("Ton navigateur ne supporte pas les notifications", "error");
            return;
        }

        // 1. Vérifier si on a le numéro de téléphone
        let tel = localStorage.getItem('sanksi_tel');
        if (!tel) {
            tel = prompt("Entre ton numéro de téléphone pour recevoir les alertes (ex: 70000000) :");
            if (tel && tel.trim() !== "") {
                tel = tel.trim();
                localStorage.setItem('sanksi_tel', tel);
            } else {
                return; // L'utilisateur a annulé
            }
        }

        // 2. Demander la permission
        const perm = await Notification.requestPermission();
        
        if (perm === 'granted') {
            try {
                // 3. Récupérer la clé publique VAPID
                const res = await fetch('/api/push/cle');
                const data = await res.json();
                if (!data.publicKey) throw new Error("Clé VAPID manquante sur le serveur");

                // 4. Enregistrer le Service Worker
                const reg = await navigator.serviceWorker.register('/sw.js');

                // 5. S'abonner au Push
                const sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(data.publicKey)
                });

                // 6. Envoyer au serveur
                await fetch('/api/push/abonner', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subscription: sub, telephone: tel })
                });

                if (window.showToast) showToast('✅ Notifications activées !', 'success');
                dismissNotifPrompt();
            } catch (err) {
                console.error("Erreur push:", err);
                if (window.showToast) showToast('Erreur : ' + err.message, 'error');
            }
        } else {
            if (window.showToast) showToast('Notifications bloquées', 'warning');
            dismissNotifPrompt();
        }
    }

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
            outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
    }


    // Fonction utilitaire obligatoire pour convertir la clé VAPID
    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
            outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
    }


    function dismissNotifPrompt() {
        localStorage.setItem('sanksi_notif_dismissed', 'true');
        document.querySelectorAll('.notif-prompt').forEach(el => el.style.display = 'none');
    }

    document.addEventListener('DOMContentLoaded', initNotifPrompts);
</script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const fields = {
                'telephone': 'sanksi_tel',
                'id_1xbet': 'sanksi_id_1xbet',
                'nom': 'sanksi_nom'
            };
            
            for (const [name, key] of Object.entries(fields)) {
                const input = document.querySelector(`input[name="${name}"]`);
                if (input) {
                    // Remplir automatiquement si on a déjà l'info
                    if (localStorage.getItem(key)) input.value = localStorage.getItem(key);
                    // Sauvegarder à chaque frappe
                    input.addEventListener('input', () => localStorage.setItem(key, input.value));
                }
            }
        });
    </script>

    <script>

        window.addEventListener('load', () => {

                if (splash) splash.classList.add('hidden');
            }, 600); // 600ms d'animation
        });

    <script>
        // Anti-double-clic sur tous les formulaires
        document.addEventListener('submit', function(e) {
            const form = e.target;
            const submitBtn = form.querySelector('button[type="submit"]');
            
            if (submitBtn) {
                // Si le bouton est déjà désactivé, on annule la soumission
                if (submitBtn.disabled) {
                    e.preventDefault();
                    return false;
                }
                
                // On désactive le bouton et on change son texte
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.7';
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '⏳ Patientez...';
                
                // Si le formulaire échoue ou que l'utilisateur revient en arrière, on réactive
                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    submitBtn.innerHTML = originalText;
                }, 5000);
            }
        });
    </script>

    <script>
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Afficher la bannière si l'utilisateur ne l'a pas encore rejetée
            if (!localStorage.getItem('sanksi_pwa_dismissed')) {
                setTimeout(() => document.getElementById('pwa-banner').classList.add('show'), 2000);
            }
        });

        window.installApp = function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') dismissPwa();
                    deferredPrompt = null;
                });
            }
        };

        window.dismissPwa = function() {
            document.getElementById('pwa-banner').classList.remove('show');
            localStorage.setItem('sanksi_pwa_dismissed', 'true');
        };
    </script>

    <script>
        function toggleTheme(e) {
            e.preventDefault();
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            
            if (isDark) {
                html.removeAttribute('data-theme');
                localStorage.setItem('sanksi_theme', 'light');
                document.getElementById('theme-text').innerText = 'Sombre';
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('sanksi_theme', 'dark');
                document.getElementById('theme-text').innerText = 'Clair';
            }
        }
        
        // Mettre à jour le texte du bouton au chargement
        document.addEventListener('DOMContentLoaded', () => {
            if (document.documentElement.getAttribute('data-theme') === 'dark') {
                document.getElementById('theme-text').innerText = 'Clair';
            }
        });
    </script>
